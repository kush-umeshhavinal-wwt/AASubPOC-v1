<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Comments Dashboard</h1>
            <p class="subtitle">Smartsheets Integration</p>
        </header>
        
        <div class="controls">
            <button id="addBtn" class="btn btn-primary">
                <span class="btn-icon">+</span> Add Comment
            </button>
            <button id="refreshBtn" class="btn btn-secondary">
                <span class="btn-icon">↻</span> Refresh
            </button>
        </div>
        
        <div id="commentsList" class="comments-list"></div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="commentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Comment</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="commentForm" class="modal-body">
                <input type="hidden" id="commentRowId">
                <input type="hidden" id="commentId">
                <div class="form-group">
                    <label for="commentText">Comment</label>
                    <textarea id="commentText" placeholder="Enter your comment..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="commentStatus">Status</label>
                    <select id="commentStatus">
                        <option value="active">Active</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Delete Comment</h2>
                <button class="modal-close" id="closeDeleteModal">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this comment?</p>
                <div class="form-actions">
                    <button id="confirmDelete" class="btn btn-danger">Delete</button>
                    <button id="cancelDelete" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script src="api.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
